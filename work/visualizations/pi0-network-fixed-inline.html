 joint:{title:'联合 Transformer',name:'self.joint_model',color:4,input:'图文 [B, 276, 2048]；状态 [B, 1, 1024]；动作 [B, 4, 1024]',output:'动作分支隐藏特征 [B, 4, 1024]',code:'self.joint_model = hydra.utils.instantiate(cfg.joint)',note:'图中视觉语言骨干与动作专家属于同一个 joint_model。它通过注意力连接不同分支；无需先把所有分支的隐藏宽度设为相同。这里只画动作生成所用的主要信息流。'},
 decoder:{title:'动作输出投影',name:'self.action_decoder',color:4,input:'action_embeds [B, 4, 1024]',output:'action_vel [B, 4, 7]',code:'nn.Linear(self.action_hidden_size, self.action_dim)\naction += delta_t * action_vel',note:'输出是速度场。推理重复更新当前动作 10 次（self.num_inference_steps=10），最后返回动作序列 [B,4,7]。'},
 lm:{title:'可选文本输出',name:'self.lm_head',color:2,input:'文本隐藏特征 [..., 2048]',output:'词表 logits [..., 257216]',code:'nn.Linear(self.image_text_hidden_size, self.vocab_size, bias=False)\nself.lm_head.weight = self.embed_tokens.weight',note:'self.use_lm_head 默认 False，所以主图省略这条可选路径。输出层和输入文本嵌入共享同一份权重。'}
};

function txt(x,y,value,anchor='middle',muted=false){return add(svg,'text',{x,y,'text-anchor':anchor,...(muted?{class:'pn-label'}:{})},value);}
function col(i){return `var(--viz-series-${i})`;}
function node(key,x,y,w,h,label,sub){const d=data[key],g=add(svg,'g',{'data-key':key,class:'cursor-interaction'});add(g,'rect',{x,y,width:w,height:h,rx:9,fill:`color-mix(in srgb,${col(d.color)} 14%,var(--background))`,stroke:key===chosen?'var(--foreground)':'var(--border)','stroke-width':key===chosen?1.7:1});
 for(let i=0;i<5;i++)add(g,'rect',{x:x+12+i*9,y:y+12,width:5,height:11,rx:1,fill:col(d.color),'fill-opacity':.35+i*.12});
 const t=add(g,'text',{x:x+w/2,y:y+43,'text-anchor':'middle',...(label.length>13?{class:'text-small'}:{})},label);if(sub)add(g,'text',{x:x+w/2,y:y+h-12,'text-anchor':'middle',class:'pn-label'},sub);

function draw(){cancelAnimationFrame(animation);paths=[];const width=Math.max(280,Math.round(canvas.getBoundingClientRect().width)),small=width<950;const height=small?1030:650;

 node('text',X(270),395,X(180),78,'embed_tokens','每个 token → 2048');link(`M${X(350)} 395V235`,2);

function play(){cancelAnimationFrame(animation);svg.querySelectorAll('.pn-particle').forEach(e=>e.remove());const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)return;const dots=paths.map(({p,color})=>({p,dot:add(svg,'circle',{r:4,fill:col(color),class:'pn-particle'}),length:p.getTotalLength()}));let start;root.querySelector('#pn-play').disabled=true;
function frame(now){if(start===undefined)start=now;const elapsed=now-start;const phases=paths.length===14?[3,4,5,2,1,1,1,2,1,0,0,0,0,0]:paths.map((_,i)=>i<5?0:i-4);for(const [i,item] of dots.entries()){const t=Math.max(0,Math.min(1,(elapsed-phases[i]*850)/750));const point=item.p.getPointAtLength(item.length*t);item.dot.setAttribute('cx',point.x);item.dot.setAttribute('cy',point.y);item.dot.setAttribute('visibility',t>0&&t<1?'visible':'hidden');}if(elapsed<6000)animation=requestAnimationFrame(frame);else{dots.forEach(d=>d.dot.remove());root.querySelector('#pn-play').disabled=false;}}animation=requestAnimationFrame(frame);}
